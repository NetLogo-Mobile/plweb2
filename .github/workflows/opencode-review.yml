name: OpenCode Codex-Style PR Reviewer

on:
  pull_request:
    types: [opened, synchronize] # PR 创建或更新时触发

permissions:
  contents: read          # 允许读取代码和 Git 历史
  pull-requests: write   # 允许在 PR 下发评论

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须为 0，AI 才能读取完整 Git 历史记录

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode CLI & Update Skills
        run: |
          npm install -g opencode-ai
          npx skills update

      - name: Fetch Target Base Branch
        run: |
          # 确保 AI 在本地可以对比 origin/<base_ref> 和 当前 HEAD
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}

      - name: Execute OpenCode Agent (Self-Exploration Mode)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # 构造让 AI 自主探索仓库的提示词
          cat << 'EOF' > review_prompt.txt
          You are a Senior Vue Architect performing an expert-level Pull Request Code Review.

          【PR Context】:
          - PR Title: $PR_TITLE
          - Base Branch: origin/$BASE_REF
          - Current Head: HEAD

          【Your Review Mission】:
          1. Use terminal commands (e.g., `git log origin/$BASE_REF..HEAD`, `git diff --stat origin/$BASE_REF...HEAD`, `git diff origin/$BASE_REF...HEAD -- <filepath>`) to inspect the commit history and changes introduced in this PR.
          2. Skip lock files (e.g., package-lock.json, yarn.lock, pnpm-lock.yaml) and build artifacts (dist/, build/).
          3. If changed files are too large, inspect them file-by-file or component-by-component. Read full files if you need extra context.
          4. Strictly evaluate the changes using Vue 3 Best Practices (Composition API, reactivity gotchas, script setup, props/emits typing, performance leaks, etc.) and general code quality standards.
          5. Write a concise, objective, and constructive Markdown review report.
          EOF

          # 启动 OpenCode，AI 会自动调用 Bash 终端执行 git 命令并分析
          opencode run \
            --model opencode/deepseek-v4-flash-free \
            --variant high \
            --dangerously-skip-permissions \
            "$(cat review_prompt.txt)" > review_report.md

      - name: Post PR Review Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 如果 AI 生成了报告则发表评论
          if [ -s review_report.md ]; then
            echo "### 🤖 Codex-Style Code Review by OpenCode (Vue Best Practice Enabled)" > final_comment.md
            echo "> 💡 Autonomous AI Reviewer inspecting git commit history and Vue code quality." >> final_comment.md
            echo "" >> final_comment.md
            cat review_report.md >> final_comment.md
            
            gh pr comment ${{ github.event.pull_request.number }} --body-file final_comment.md
          else
            echo "No review report generated."
          fi
