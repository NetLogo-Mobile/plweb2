appId: com.turtlesim.plweb
productName: plweb
directories:
  buildResources: buildResources
  output: dist_electron
files:
  - dist-electron/**/*
  - dist/**
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

